repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
  # Which layer may import which, inside a member — see [tool.importlinter] in
  # pyproject.toml. Runs from the project venv (language: system) because it
  # resolves the third-party packages it forbids, so it has to be able to
  # import them.
  - repo: local
    hooks:
      - id: lint-imports
        name: lint imports (layering)
        entry: uv run --no-sync lint-imports
        language: system
        pass_filenames: false
        files: ^packages/.+/src/digitex/.+\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
