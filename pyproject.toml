# Workspace root. Builds nothing itself (`package = false`); it exists to hold
# the member list, the dev toolchain, and the tool configuration the whole
# repo shares.
#
# Sync what you work on:
#
#     uv sync --all-extras --no-extra cpu      # laptop with CUDA: everything
#     uv sync --all-extras --no-extra cu130    # CI, or any machine without CUDA
#     uv sync                                  # service only — bot + db
#     uv sync --no-dev --group contracts       # what production installs
#
[project]
name = "digitex"
version = "0.2.0"
description = "Document digitization toolkit"
readme = "README.md"
requires-python = ">=3.13"
# The service half is always present: it is small, and it is what the tests
# import most. The studio is opt-in because it costs gigabytes.
dependencies = [
  "digitex-core",
  "digitex-service",
]

[project.optional-dependencies]
# Scans to a question corpus — docs/extraction.md, docs/training.md,
# docs/label-studio.md.
studio = ["digitex-studio[labeling,ml]"]

# `ml` needs torch, and these two decide which wheel index it comes from:
# `cu130` is the CUDA build, `cpu` is ~200MB instead of ~3GB. They conflict, so
# exactly one can be active — and with neither, ultralytics pulls whatever
# build PyPI offers.
cpu = ["torch", "torchvision"]
cu130 = ["torch", "torchvision"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
digitex-core = { workspace = true }
digitex-service = { workspace = true }
digitex-studio = { workspace = true }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.extra-build-dependencies]
htmlmin = ["legacy-cgi"]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
    "mdformat>=1.0.0",
    "pre-commit>=4.0.0",
    "testcontainers[postgres]>=4.0",
]
# Just enough to run tests/contracts in an environment built the way production
# is — `uv sync --no-dev --group contracts`, which installs digitex-service and
# nothing from the studio. Adding a studio dependency here would defeat the
# point of the job that uses it.
contracts = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=digitex --cov-report=term-missing"
markers = [
    "integration: exercises a real Postgres via testcontainers (requires Docker)",
    "differential: replays a recorded book (requires a recording under the data root)",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:pytz",
    "ignore::pydantic.PydanticDeprecatedSince20:label_studio_sdk",
    # Production classes whose names happen to start with "Test". Both are
    # domain terms — a Test is an exam — so they keep the name and pytest is
    # told to leave them alone.
    "ignore:cannot collect test class 'TestResult':pytest.PytestCollectionWarning",
    "ignore:cannot collect test class 'TestingState':pytest.PytestCollectionWarning",
]

# Most of what four contracts used to defend is now a packaging fact:
# `digitex-service` does not depend on `digitex-studio`, so the deployed bot
# cannot reach opencv or torch however hard it tries. What is left is the rule
# packaging cannot express — the direction of imports *inside* a member — plus
# one belt-and-braces check, because lint runs in a dev environment where the
# studio is installed and an accidental import would otherwise stay invisible
# until the contracts job.
#
# Run with `uv run lint-imports`; also a pre-commit hook and a CI job.
[tool.importlinter]
root_packages = [
    "digitex.bot",
    "digitex.config",
    "digitex.db",
    "digitex.domain",
    "digitex.imaging",
    "digitex.labeling",
    "digitex.ml",
    "digitex.pipeline",
    "digitex.service",
    "digitex.studio",
    "digitex.ui",
]
# Needed by the last contract, which names third-party packages.
include_external_packages = true

# The inversion, stated. The bot is written against the protocols in
# `digitex.domain.ports`; `digitex.db` provides classes that answer to them and
# `digitex.service.cli.bot` is the one module that names both. It is what makes
# the boundary structural rather than policed: with the arrow pointing the other
# way, an accidental import is a contract failure here rather than an
# ImportError on the VPS.
[[tool.importlinter.contracts]]
name = "The bot does not know what a database is"
type = "forbidden"
source_modules = ["digitex.bot"]
forbidden_modules = ["digitex.db", "psycopg", "psycopg_pool"]

[[tool.importlinter.contracts]]
name = "Service branch is layered"
type = "layers"
layers = ["digitex.service", "digitex.bot", "digitex.db", "digitex.domain"]

[[tool.importlinter.contracts]]
name = "Studio branch is layered"
type = "layers"
layers = [
    "digitex.studio",
    "digitex.ui",
    "digitex.pipeline",
    "digitex.labeling",
    "digitex.ml",
    "digitex.imaging",
    "digitex.domain",
]

# Belt and braces over the packaging boundary. `digitex-service` cannot import
# these in production because they are not installed; this catches the mistake
# on a dev machine, where they are.
[[tool.importlinter.contracts]]
name = "The deployed half cannot reach the studio"
type = "forbidden"
source_modules = [
    "digitex.bot",
    "digitex.config",
    "digitex.db",
    "digitex.domain",
    "digitex.service",
]
forbidden_modules = [
    "digitex.imaging",
    "digitex.labeling",
    "digitex.ml",
    "digitex.pipeline",
    "digitex.ui",
    "cv2",
    "label_studio_sdk",
    "numpy",
    "openai",
    "PIL",
    "pytesseract",
    "tkinter",
    "torch",
    "ultralytics",
]

[tool.ty.environment]
python-version = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["packages/core/src", "packages/service/src", "packages/studio/src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "PT", "TCH", "RUF",
    "PL",
    "SIM",
    "RET",
    "PTH",
    "D",
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203",
    "D213",
    "PLR0913",
    "PLR2004",
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004", "S101"]
# Russian user-facing strings; long format strings
"packages/service/src/digitex/bot/messages.py" = ["RUF001", "E501"]
"tests/unit/test_pipeline_answers.py" = ["RUF001"]  # Cyrillic/Latin normalization is under test
"tests/unit/test_domain_entities.py" = ["RUF001", "RUF002"]  # Cyrillic question keys are under test
"tests/unit/test_pipeline_page.py" = ["RUF001"]  # Cyrillic part markers are under test
"tests/unit/test_bot_messages.py" = ["RUF001"]  # Russian user-facing strings

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
known-first-party = ["digitex"]
