[project]
name = "digitex"
version = "0.1.0"
description = "Document digitization toolkit"
readme = "README.md"
requires-python = ">=3.13"
# What production runs — the bot process and the migrations it applies on
# deploy, and nothing else. The Dockerfile installs exactly this list from
# uv.lock, so anything added here lands in the deployed image.
dependencies = [
  "aiogram>=3.30.0",
  "alembic>=1.19.1",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.0",
  "structlog>=25.5.0",
  "tqdm",
  "typer",
]

# Everything else belongs to one of the local workflows, and is an extra so it
# stays out of the image. Sync what you work on:
#
#     uv sync --all-extras --no-extra cpu     # laptop / GPU: everything
#     uv sync --extra pipeline                # books -> question images
#     uv sync --all-extras --no-extra cu130   # CI, or any machine without CUDA
#
# Each extra names the package it installs the dependencies of, so
# [tool.importlinter] can state which ones the deployed bot may not reach.
[project.optional-dependencies]
# digitex.pipeline, digitex.imaging, digitex.ui — docs/extraction.md
pipeline = [
  "deskew",
  "numpy",
  "openai",
  "opencv-python",
  "pillow",
  "pytesseract",
]
# YOLO segmentation, training and prediction — docs/training.md
ml = [
  "numpy",
  "pillow",
  "pyyaml",
  "shapely>=2.1.2",
  "ultralytics",
]
# Annotation server and its SDK — docs/label-studio.md
labeling = [
  "label-studio>=1.23.0",
  "label-studio-sdk",
  "legacy-cgi>=2.6.4",
]

# `ml` needs torch, and these two decide which wheel index it comes from:
# `cu130` is the CUDA build, `cpu` is ~200MB instead of ~3GB. They conflict, so
# exactly one can be active — and with neither, ultralytics pulls whatever
# build PyPI offers.
cpu = ["torch", "torchvision"]
cu130 = ["torch", "torchvision"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[tool.uv.extra-build-dependencies]
htmlmin = ["legacy-cgi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "graphifyy>=0.7.11",
    "import-linter>=2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
    "mdformat>=1.0.0",
    "pre-commit>=4.6.1",
    "testcontainers[postgres]>=4.0",
]
# Just enough to run tests/contracts in an environment built the way production
# is — `uv sync --no-dev --group contracts`, no extras. Adding anything from an
# extra here would defeat the point of the job that uses it.
contracts = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digitex"]

[project.scripts]
digitex-extract = "digitex.cli.extraction:app"
digitex-train = "digitex.cli.training:app"
digitex-bot = "digitex.cli.bot:app"
digitex-db = "digitex.cli.db:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src/digitex --cov-report=term-missing"
markers = [
    "integration: exercises a real Postgres via testcontainers (requires Docker)",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:pytz",
    "ignore::pydantic.PydanticDeprecatedSince20:label_studio_sdk",
    # Production classes whose names happen to start with "Test". Both are
    # domain terms — a Test is an exam — so they keep the name and pytest is
    # told to leave them alone.
    "ignore:cannot collect test class 'TestResult':pytest.PytestCollectionWarning",
    "ignore:cannot collect test class 'TestingState':pytest.PytestCollectionWarning",
]

# The deploy boundary, enforced. Only the bot ships, so nothing it reaches may
# touch a dependency the production image does not install — and an accidental
# import is otherwise invisible until the bot ImportErrors on the VPS, because
# CI installs every extra and the Docker build imports nothing.
#
# Run with `uv run lint-imports`; also a pre-commit hook and a CI job.
[tool.importlinter]
root_package = "digitex"
# Needed by the third contract, which names third-party packages.
include_external_packages = true

# Two contracts rather than one list: the bot and the pipeline are parallel
# branches over db/domain, and a single ordering would quietly grant the
# pipeline permission to import the bot.
[[tool.importlinter.contracts]]
name = "Deploy branch is layered"
type = "layers"
layers = ["digitex.cli", "digitex.bot", "digitex.db", "digitex.domain"]

[[tool.importlinter.contracts]]
name = "Pipeline branch is layered"
type = "layers"
layers = [
    "digitex.cli",
    "digitex.ui",
    "digitex.pipeline",
    "digitex.labeling",
    "digitex.ml",
    "digitex.imaging",
    "digitex.domain",
]

# Both forbidden contracts guard the same module set: everything the deployed
# bot can reach. Keep their source_modules in sync with each other and with
# DEPLOY_PACKAGES in tests/contracts/test_deploy_boundary.py.
[[tool.importlinter.contracts]]
name = "The deployed bot cannot reach the pipeline"
type = "forbidden"
source_modules = [
    "digitex.bot",
    "digitex.cli._shared",
    "digitex.cli.bot",
    "digitex.cli.db",
    "digitex.config",
    "digitex.db",
    "digitex.domain",
    "digitex.logging",
]
forbidden_modules = [
    "digitex.imaging",
    "digitex.labeling",
    "digitex.ml",
    "digitex.pipeline",
    "digitex.ui",
]

# The contract that actually protects the image: the production dependency list
# in [project.dependencies] is the whole of what gets installed, so reaching any
# of these from the deploy layer is an ImportError in production.
[[tool.importlinter.contracts]]
name = "The deployed bot cannot reach a non-production dependency"
type = "forbidden"
source_modules = [
    "digitex.bot",
    "digitex.cli._shared",
    "digitex.cli.bot",
    "digitex.cli.db",
    "digitex.config",
    "digitex.db",
    "digitex.domain",
    "digitex.logging",
]
forbidden_modules = [
    "cv2",
    "deskew",
    "label_studio_sdk",
    "numpy",
    "openai",
    "PIL",
    "pytesseract",
    "tkinter",
    "torch",
    "ultralytics",
]

[tool.ty.environment]
python-version = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "PT", "TCH", "RUF",
    "PL",
    "SIM",
    "RET",
    "PTH",
    "D",
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203",
    "D213",
    "PLR0913",
    "PLR2004",
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004", "S101"]
"src/digitex/bot/messages.py" = ["RUF001", "E501"]  # Russian user-facing strings; long format strings
"tests/unit/test_pipeline_answers.py" = ["RUF001"]  # Cyrillic/Latin normalization is under test
"tests/unit/test_domain_entities.py" = ["RUF001", "RUF002"]  # Cyrillic question keys are under test
"tests/unit/test_pipeline_page.py" = ["RUF001"]  # Cyrillic part markers are under test
"tests/unit/test_bot_messages.py" = ["RUF001"]  # Russian user-facing strings

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
known-first-party = ["digitex"]
