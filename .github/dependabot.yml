version: 2

# Every pin in this repo is only as good as something bumping it. All three
# open PRs against develop, so the CI workflow gates them before they reach
# main and deploy.
updates:
  # The action versions in ci.yml / deploy.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: ci

  # The base image digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: build

  # uv.lock, which is what the deployed image installs.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: build
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
