name: Deploy

on:
  push:
    branches: [main]
  # Re-release an already-published tag — the rollback path. Leave the input
  # empty to build and release the current main instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to release (e.g. sha-abc1234)"
        required: false
        default: ""

# One release at a time, and never cancel one in flight: a half-applied
# migration is worse than a slow queue.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/seblful/digitex-bot

jobs:
  # Same checks a PR gets. main deploys only what passes them.
  ci:
    if: inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish image
    if: inputs.tag == ''
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is the commit's short SHA — immutable, and it names the commit
      # whose compose file the release should use.
      - name: Resolve image tag
        id: tag
        run: echo "value=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release to VPS
    needs: [ci, publish]
    # `ci` and `publish` are skipped on a rollback dispatch; skipped is not
    # failed, so this still runs — but a real failure upstream stops it.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is unset — trusting the host key on first sight; see docs/ci-cd.md"
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Release
        env:
          TAG: ${{ inputs.tag || needs.publish.outputs.tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/digitex' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          # scp spells the port -P, ssh spells it -p, so the shared options stop
          # short of it.
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_deploy")

          # Ship the script rather than inlining it, so stdin stays free for the
          # registry token that `docker login --password-stdin` reads.
          scp -P "$VPS_PORT" "${opts[@]}" scripts/deploy.sh "$VPS_USER@$VPS_HOST:/tmp/digitex-deploy.sh"

          printf '%s' "$GHCR_TOKEN" | ssh -p "$VPS_PORT" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "TAG='$TAG' APP_DIR='$APP_DIR' GHCR_USER='$GHCR_USER' bash /tmp/digitex-deploy.sh"

      - name: Summarize
        if: always()
        env:
          TAG: ${{ inputs.tag || needs.publish.outputs.tag }}
        run: |
          {
            echo "### ${{ job.status }}: \`$TAG\`"
            echo
            echo "Rollback: run this workflow again with the previous \`sha-…\` tag."
          } >> "$GITHUB_STEP_SUMMARY"
