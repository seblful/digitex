name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  # deploy.yml calls this as its gate, so a push to main runs these checks once
  # rather than twice.
  workflow_call:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite imports every extra — OpenCV, ultralytics, the Label Studio SDK —
  # so CI installs all of them. Excluding cu130 leaves the conflicting `cpu`
  # extra to supply torch: ~200MB of CPU wheels rather than ~3GB of CUDA ones,
  # on a runner that has no GPU to use them.
  UV_SYNC_ARGS: --locked --all-extras --no-extra cu130 --group dev

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      # The same hooks that run on commit: ruff, ruff-format, mdformat,
      # whitespace/YAML/TOML checks. Hook versions are pinned in the config, so
      # this cannot drift from local runs.
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        env:
          # lint-imports needs the project environment, which this job does not
          # build. The deploy-boundary job runs it against a real one.
          SKIP: lint-imports
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086  # the flags are meant to split
          uv sync $UV_SYNC_ARGS

      - name: Type check
        run: uv run --no-sync ty check

  test:
    name: test
    runs-on: ubuntu-latest

    # The integration suite talks to a real Postgres. Handing it one here is
    # cheaper than letting testcontainers start its own inside the runner.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digitex
          POSTGRES_PASSWORD: digitex
          POSTGRES_DB: digitex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitex -d digitex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest migrates this database and truncates it between tests.
      DIGITEX_TEST_DSN: postgresql://digitex:digitex@localhost:5432/digitex_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      # opencv-python links against these; the runner image does not always
      # ship them, and `import cv2` fails at collection time without them.
      - name: Install OpenCV system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086  # the flags are meant to split
          uv sync $UV_SYNC_ARGS

      - name: Run tests
        run: uv run --no-sync pytest

  # Only the bot deploys, and its image installs [project.dependencies] alone.
  # An accidental import of an extras-only module is otherwise invisible until
  # the bot ImportErrors on the VPS: the test job above installs every extra,
  # and the docker build imports no application code. Both halves of the check
  # live here because both need an environment built on purpose.
  deploy-boundary:
    name: deploy boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Install OpenCV system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # The static half: which package may import which, transitively, plus the
      # third-party packages the deploy layer may not reach. Needs the full
      # environment so the forbidden externals resolve.
      - name: Install full environment
        run: |
          # shellcheck disable=SC2086  # the flags are meant to split
          uv sync $UV_SYNC_ARGS

      - name: Check import contracts
        run: uv run --no-sync lint-imports

      # The empirical half: build the environment production actually gets —
      # no dev group, no extras — and import every module the bot can reach.
      # addopts carries --cov, and pytest-cov is a dev dependency that this
      # environment deliberately lacks.
      - name: Import every deployed module with production dependencies only
        env:
          UV_PROJECT_ENVIRONMENT: .venv-prod
        run: |
          uv sync --locked --no-dev --group contracts
          uv run --no-sync pytest tests/contracts -o addopts="" -q

  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only — publishing happens in deploy.yml, on main. This catches a
      # broken Dockerfile on a PR instead of at release time.
      - name: Build bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: digitex-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if the entrypoint's imports resolve, so prove
      # the CLI starts. `--help` exits 0 without a bot token or a database.
      - name: Smoke test the image
        run: docker run --rm digitex-bot:ci digitex-db --help

      # The bot entrypoint's real import graph, not just the CLI shim, and the
      # migrations resolved out of the installed package rather than a copy of
      # src/ that the image no longer carries.
      - name: Prove the entrypoint and the packaged migrations import
        run: |
          docker run --rm digitex-bot:ci python -c "
          import digitex.cli.bot, digitex.bot.dispatcher
          from digitex.db.schema import alembic_config
          from pathlib import Path
          loc = Path(alembic_config().get_main_option('script_location'))
          assert (loc / 'env.py').exists(), loc
          assert list((loc / 'versions').glob('*.py')), loc
          print('entrypoint and migrations OK')
          "

      # The image must NOT contain the local-workflow stack. If this ever
      # succeeds, something moved a heavy dependency into the production set.
      - name: Assert the pipeline stack is absent
        run: |
          if docker run --rm digitex-bot:ci python -c "import cv2" 2>/dev/null; then
            echo "::error::cv2 is installed in the production image"
            exit 1
          fi
          if docker run --rm digitex-bot:ci python -c "import torch" 2>/dev/null; then
            echo "::error::torch is installed in the production image"
            exit 1
          fi
          echo "pipeline stack correctly absent"
