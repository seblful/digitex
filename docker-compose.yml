# Uncapped json-file logs are how a $5 VPS runs out of disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: digitex-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digitex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-digitex}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  bot:
    build: .
    # CI builds this image and pushes it per-commit; the VPS pulls the tag the
    # deploy pins in .env.production. `build:` stays so local `up` still builds
    # from source instead of reaching for the registry.
    image: ghcr.io/seblful/digitex-bot:${TAG:-latest}
    container_name: digitex-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-digitex}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-digitex}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    # Reaching the database proves more than the process being alive, which the
    # restart policy already covers: the container exits if the bot dies.
    healthcheck:
      test: ["CMD-SHELL", "digitex-db current > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Long polling holds a request open for up to 30s; the 10s default would
    # SIGKILL the bot mid-update on every deploy.
    stop_grace_period: 40s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
